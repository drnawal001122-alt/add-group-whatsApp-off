  <!-- ===== CONFIRMATION POPUP ===== -->
  <div id="confirmPopupOverlay" style="
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    z-index: 9999;
    justify-content: center;
    align-items: center;
  ">
    <div style="
      background: #fff;
      border-radius: 20px;
      padding: 32px 28px 24px;
      max-width: 340px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      animation: popupIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
    ">
      <!-- Icône succès -->
      <div style="
        width: 68px; height: 68px;
        background: linear-gradient(135deg,#25D366,#128C7E);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 18px;
        box-shadow: 0 8px 24px rgba(37,211,102,0.35);
      ">
        <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
      </div>

      <h3 id="popupTitle" style="
        margin: 0 0 10px;
        font-size: 1.2rem;
        font-weight: 700;
        color: #111;
      ">تم تسجيل الدخول بنجاح! 🎉</h3>

      <p id="popupMsg" style="
        margin: 0 0 24px;
        font-size: 0.92rem;
        color: #666;
        line-height: 1.5;
      ">تم التحقق من حسابك بنجاح. سيتم إعادة توجيهك تلقائياً...</p>

      <!-- Barre de progression -->
      <div style="
        background: #f0f0f0;
        border-radius: 99px;
        height: 5px;
        overflow: hidden;
        margin-bottom: 20px;
      ">
        <div id="popupProgressBar" style="
          height: 100%;
          width: 100%;
          background: linear-gradient(90deg,#25D366,#128C7E);
          border-radius: 99px;
          transition: width 3s linear;
        "></div>
      </div>

      <button id="popupOkBtn" onclick="closePopupAndGoLogin()" style="
        background: linear-gradient(135deg,#25D366,#128C7E);
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 13px 0;
        width: 100%;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
      " onmouseover="this.style.opacity='0.88'" onmouseout="this.style.opacity='1'"
         id="popupOkBtnLabel">OK</button>
    </div>
  </div>

  <style>
    @keyframes popupIn {
      from { opacity:0; transform: scale(0.7) translateY(30px); }
      to   { opacity:1; transform: scale(1) translateY(0); }
    }
  </style>

  <script>
    window.showConfirmPopup = function() {
      document.getElementById('confirmPopupOverlay').style.display = 'flex';
      var bar = document.getElementById('popupProgressBar');
      bar.style.width = '100%';
      setTimeout(function() { bar.style.width = '0%'; }, 50);
      setTimeout(function() { closePopupAndGoLogin(); }, 3000);
    };

    window.closePopupAndGoLogin = function() {
      document.getElementById('confirmPopupOverlay').style.display = 'none';
      if (typeof loadPage === 'function') loadPage('Login');
    };
  </script>
